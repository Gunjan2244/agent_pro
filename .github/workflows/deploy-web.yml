# Auto-deploys the public-site renderer (docs/WEB_RENDERER.md) to Cloudflare Workers on every
# push to main that touches the renderer. This is the one approved exception to CLAUDE.md's
# "deploying needs the user's explicit approval each time" rule — see DECISIONS #118.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   scoped to "Edit Cloudflare Workers" on the target account
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
#   SUPABASE_URL           baked into dist/config.js
#   SUPABASE_ANON_KEY      baked into dist/config.js
# Optional repo variable:
#   SITE_BASE_URL          defaults to the current preview Worker URL below
name: Deploy web renderer

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "scripts/build-web.sh"
      - "scripts/gen-tokens.mjs"
      - "scripts/gen-icons.mjs"
      - "scripts/release-check.mjs"
      - "scripts/test-web*.mjs"
      - "scripts/lint-web-css.mjs"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test (node scripts/test-web.mjs, the master suite; then the CSS lint)
        run: |
          node scripts/test-web.mjs
          node scripts/lint-web-css.mjs

      - name: Build web/dist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://agentpro-sites.sledjesoftwares.workers.dev' }}
        # No RELEASE=1: public launch is still waiting on the P1 privacy items (PRIVACY.md), so
        # this stays the same preview build (demo data only) the docs describe. Flip to
        # `RELEASE=1 sh scripts/build-web.sh` once release-check.mjs reports no blockers.
        run: sh scripts/build-web.sh

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.151.1 deploy --config web/wrangler.jsonc
