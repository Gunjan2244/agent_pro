# --- Memory (the dev machine has ~7 GB RAM and little free; keep these conservative) ---
# One Gradle daemon; the Kotlin compiler runs inside it (in-process) so no second JVM is started.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
# Only used if the strategy above is switched back to "daemon".
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Kotlin ---
kotlin.code.style=official
# iOS targets are declared but can only be built on macOS; don't warn about them on Linux.
kotlin.native.ignoreDisabledTargets=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
# Never let AGP install SDK components on its own; missing ones are installed deliberately (docs/STATUS.md).
android.builder.sdkDownload=false
